services:
  app:
    build: .
    environment: &hoard-environment
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me}
      HOARD_RUN_MIGRATIONS: "true"
      HOARD_USE_COMPILED_SYSTEMS: "true"
      POSTGRES_DB: hoard
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: hoard
      POSTGRES_USER: hoard
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - hoard_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["celery", "-A", "hoard", "worker", "--loglevel=INFO"]
    environment:
      <<: *hoard-environment
      HOARD_RUN_MIGRATIONS: "false"
    volumes:
      - hoard_media:/app/media
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  db:
    container_name: hoard_db
    image: postgres:18
    environment:
      POSTGRES_DB: hoard
      POSTGRES_USER: hoard
      POSTGRES_PASSWORD: hoard
    ports:
      - "5432:5432"
    volumes:
      - hoard_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoard -d hoard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hoard_db_data:
  hoard_media:
