{% load django_vite static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if vite_dev_mode %}
      <link rel="icon" type="image/svg+xml" href="http://localhost:5173/static/favicon.svg">
    {% else %}
      <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    {% endif %}
    <title>Hoard</title>
    {% vite_hmr_client %}
    {% vite_asset 'src/main.ts' %}
  </head>
  <body style="background-color: #111513;">
    <div id="app"></div>
  </body>
</html>
