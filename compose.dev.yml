services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hoard
      POSTGRES_USER: hoard
      POSTGRES_PASSWORD: hoard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoard -d hoard"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - dev_db_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data

  app:
    build: .
    command: dev
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,app
      POSTGRES_DB: hoard
      POSTGRES_USER: hoard
      POSTGRES_PASSWORD: hoard
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - dev_media:/app/media

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app
    environment:
      VITE_BACKEND_URL: http://app:8000
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules

volumes:
  dev_db_data:
  dev_media:
  dev_node_modules:
  dev_redis_data:
